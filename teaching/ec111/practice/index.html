:root{--blue:#3d5a80;--ink:#494e52;--muted:#6A7280;--panel:#EEF1FA;--line:#D5DAE6;--good:#2E7D5B;--bad:#B3323C;--bg:#ffffff}
*{box-sizing:border-box}.masthead{background:#fff;border-bottom:1px solid #f2f3f3}.masthead div{max-width:900px;margin:0 auto;padding:.5em 1em;display:flex;flex-wrap:wrap;align-items:center;gap:.25em 1.5em}.masthead a{color:#494e52;text-decoration:none;font-size:16px}.masthead a:hover{color:#5b6166}.masthead a.name{font-weight:700;margin-right:.5em}a:hover{color:#2a3f5a}button.go:hover{background:#2a3f5a;border-color:#2a3f5a}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,".SFNSText-Regular","San Francisco","Roboto","Segoe UI","Helvetica Neue","Lucida Grande",Arial,sans-serif}

.top{max-width:760px;margin:0 auto;padding:16px 16px 0;font-size:.95rem}

.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}

label.row{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
label.row small{color:var(--muted);margin-left:auto;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto}

<script>
const CHAPTERS = [{"chapter": 1, "label": "1–2", "title": "Ten Principles of Economics; Thinking Like an Economist", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Scarcity", "stem": "A regional hospital system cannot hire every nurse, buy every scanner and build every ward its planners would like, because its budget, staff and space are limited. Economists call this condition", "options": ["market power.", "the business cycle.", "inequality.", "scarcity."], "answer": 3, "reasons": ["Market power is the ability of one seller or a small group to influence prices. The hospital's problem is limited resources, not control over prices.", "The business cycle is the up-and-down movement of the whole economy's output. It does not describe a lack of resources at one organization.", "Inequality concerns how income or wealth is shared among people. The hospital's problem is that its resources fall short of its wants.", ""], "why": "Scarcity means resources are limited, so not every want can be met. The hospital system's budget, staff and space cannot cover everything its planners want, so it must choose. That is scarcity.", "key": "ch1-E1"}, {"id": "E2", "difficulty": "Easy", "type": "tf", "topic": "Trade-offs", "stem": "An accountant with a fixed workday cannot do tasks simultaneously. Allocating more of that day to reconciling invoices leaves less time for other work.", "answer": true, "why": "The workday limits the accountant's available time. More time spent reconciling invoices means less time available for other tasks. That sacrifice is a trade-off.", "key": "ch1-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Incentives", "stem": "In economic decision making, a reward or penalty that can change a decision is called", "options": ["an opportunity cost.", "an externality.", "an incentive.", "a measure of productivity."], "reasons": ["Opportunity cost is the value of the alternative forgone, whereas the stem asks for the term describing a reward or penalty.", "An externality is an effect on a bystander, rather than the name for a reward or penalty that influences a decision.", "", "Productivity measures output per unit of labor, rather than a reward or penalty that influences behavior."], "answer": 2, "why": "An incentive changes how attractive an action is by changing its benefits or costs. A reward encourages an action, while a penalty discourages the action it applies to.", "key": "ch1-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Inflation and unemployment", "stem": "When a central bank slows the growth of money to bring inflation down, joblessness usually falls during the next year or two as well.", "answer": false, "why": "One of the ten principles is that society faces a short-run trade-off between inflation and unemployment. Slower money growth brings inflation down, but for a time it tends to raise unemployment. In the short run the two move in opposite directions, not together. The statement is false.", "key": "ch1-E4"}, {"id": "E5", "difficulty": "Easy", "type": "mc", "topic": "Market power", "stem": "A water utility is the only supplier in its region and can set prices well above its costs without losing customers. This is an example of", "options": ["an externality.", "the invisible hand.", "market power.", "high productivity."], "answer": 2, "reasons": ["An externality is an effect on a bystander who is not part of the trade. Here the issue is the utility's control over its own price.", "The invisible hand works through competition among many buyers and sellers. A sole supplier setting high prices is the opposite case.", "", "Productivity is output per hour of work. Charging prices far above cost says nothing about how much each worker produces."], "why": "Market power is the ability of a single seller, or a small group, to influence market prices. As the only supplier, the utility can keep prices well above cost. That is market power, one cause of market failure.", "key": "ch1-E5"}, {"id": "E6", "difficulty": "Easy", "type": "mc", "topic": "Economists in government", "stem": "Government economists study a proposed merger between two large hospital chains and advise whether it breaks the nation's antitrust laws. These economists most likely work at the", "options": ["Department of Labor.", "Federal Reserve.", "Congressional Budget Office.", "Department of Justice."], "answer": 3, "reasons": ["Economists at the Department of Labor analyze data on workers and job seekers, not mergers.", "Economists at the Federal Reserve analyze the economy to guide monetary policy.", "The Congressional Budget Office evaluates policy proposals for Congress. It does not enforce antitrust laws.", ""], "why": "The Department of Justice enforces the nation's antitrust laws. Its economists study mergers and other conduct that may reduce competition.", "key": "ch1-E6"}, {"id": "E7", "difficulty": "Easy", "type": "mc", "topic": "Graphs and correlation", "stem": "Data for a group of cities show that the higher the price of a monthly transit pass, the fewer riders the transit system has. The price and the number of riders are", "options": ["positively correlated, because both are measured over the same month.", "negatively correlated, because a higher price goes with fewer riders.", "uncorrelated, because one is a price and the other is a quantity.", "positively correlated, because a change in one goes with a change in the other."], "answer": 1, "reasons": ["Measuring both over the same period says nothing about the sign of the relationship. They move in opposite directions.", "", "Variables measured in different units can still be correlated. Here a higher price goes with fewer riders, so they are related.", "A change in one going with a change in the other shows correlation, but here a higher price goes with fewer riders, so the correlation is negative."], "why": "Two variables are negatively correlated when one tends to be high while the other is low. A higher pass price goes with fewer riders, so the correlation is negative.", "key": "ch1-E7"}, {"id": "E8", "difficulty": "Easy", "type": "tf", "topic": "Thinking at the margin", "stem": "A software firm thinking at the margin hires one more engineer when the extra revenue she brings in is greater than the extra cost of employing her.", "answer": true, "why": "Rational decision makers think at the margin. They take an action when its marginal benefit exceeds its marginal cost. For the firm, the marginal benefit of the hire is the extra revenue and the marginal cost is the extra pay and other costs of employing her.", "key": "ch1-E8"}, {"id": "E9", "difficulty": "Easy", "type": "tf", "topic": "Productive efficiency", "stem": "An economy's output bundle lies exactly on the limit of what its existing resources and methods allow. Economists classify this bundle as productively inefficient.", "answer": false, "why": "A bundle at the boundary of what current resources and technology can produce is productively efficient. Inefficiency describes a failure to reach that boundary, so the statement is false.", "key": "ch1-E9"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Positive and normative statements", "stem": "A city council member says, \"The city ought to spend more on public parks.\" An economist would classify this statement as", "options": ["positive, because it can be tested with data.", "normative, because it says what policy should be.", "positive, because a public official made it.", "macroeconomic, because it concerns government spending."], "reasons": ["No data can show what the city ought to do. Tests with data apply to positive claims about cause and effect.", "", "Who makes a statement does not decide whether it is positive or normative. Its content does.", "The statement is about one city's budget, and it is a value judgment. Being about government does not make it macroeconomic."], "answer": 1, "why": "A positive statement describes how the world is and can be tested against evidence. A normative statement says how the world ought to be and rests on values. \"The city ought to spend more\" is a recommendation, so it is normative.", "key": "ch1-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Economics as a science", "stem": "Economists studying how a cut in unemployment benefits affects job search cannot run a controlled laboratory test on a whole economy. Instead, they most often", "options": ["assume the answer and skip testing.", "use data from suitable past policy changes that provide natural experiments.", "rely only on surveys of other economists.", "conclude that the question cannot be studied."], "answer": 1, "reasons": ["Economists test theories against evidence. Assuming the answer would not be science.", "", "Opinions of other economists are not evidence about how job seekers behave.", "The question can be studied. History supplies cases where benefits changed, and economists use those data."], "why": "Laboratory experiments on a national economy are usually impossible. Economists can instead study suitable historical changes that provide natural experiments, such as benefit reforms that allow otherwise comparable groups to be compared. Not every policy change provides such a comparison.", "key": "ch1-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost", "stem": "A manager turns down a consulting job that would pay $8,000 so that she can take a two-week course. The course fee is $2,000. What is the opportunity cost of taking the course?", "options": ["$10,000", "$2,000", "$8,000", "$6,000"], "reasons": ["", "$2,000 counts only the fee. She also gives up the $8,000 she would have earned.", "$8,000 counts only the lost earnings. She also pays the $2,000 fee.", "$6,000 subtracts the fee from the lost earnings. Both are costs of the course, so they are added."], "answer": 0, "why": "The opportunity cost of an action is everything given up to take it. Taking the course costs her the $2,000 fee and the $8,000 she would have earned from the consulting job. The opportunity cost is $2,000 + $8,000 = $10,000.", "key": "ch1-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "mc", "topic": "Thinking at the margin", "stem": "A distribution company has ample warehouse space but too few loading docks. Although storage is essential to its business, it would pay more for access to another dock than for another storage unit. Its willingness to pay depends on", "options": ["the total usefulness of all the storage space it already uses.", "the amount it paid for its existing buildings.", "the number of facilities it owns, regardless of what an additional facility contributes.", "the extra benefit provided by the additional dock or storage unit."], "answer": 3, "reasons": ["The total usefulness of existing storage does not measure the benefit of an additional unit.", "Past spending does not measure the additional benefit from a new dock or storage unit.", "The number already owned matters only through its effect on the benefit of another unit.", ""], "why": "Willingness to pay for an additional unit depends on its marginal benefit. Extra storage adds little when warehouse space is already ample. An extra loading dock can be more valuable when docks are scarce, even though storage as a whole is essential.", "key": "ch1-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Efficiency and equality", "stem": "A consulting firm divides its bonus fund equally among its staff. Pay becomes more equal, but the weaker reward for completing extra assignments leads staff to finish less work with the same resources. This illustrates the trade-off between", "options": ["efficiency and equality.", "inflation and unemployment.", "saving and investment.", "imports and exports."], "answer": 0, "reasons": ["", "The example concerns the distribution of pay and productive output, not changes in inflation and unemployment.", "The example changes how bonuses are shared and how much work is completed, rather than trading off saving and investment.", "The example contains no international transactions."], "why": "Sharing the bonus fund equally makes pay more equal. The stated reduction in work completed from the same resources reduces efficiency. The firm gains equality at the cost of efficiency.", "key": "ch1-M5"}, {"id": "M6", "difficulty": "Moderate", "type": "mc", "topic": "Productivity and living standards", "stem": "According to the principles of economics, the large and lasting differences in average living standards across countries are mainly explained by", "options": ["differences in labor union membership.", "differences in the size of each country's money supply.", "differences in productivity, the output produced per hour of work.", "differences in how many people each country employs in government."], "answer": 2, "reasons": ["Union membership can shift how income is divided, but it does not explain why some countries produce far more per person than others.", "Printing more money raises prices. It does not raise the quantity of goods and services a country can produce.", "", "The size of government employment does not determine how much a typical worker produces, which is what drives living standards."], "why": "A country's standard of living depends on its ability to produce goods and services. That ability is its productivity: the output a worker produces in an hour. Countries where workers produce more per hour have higher average incomes.", "key": "ch1-M6"}, {"id": "M7", "difficulty": "Moderate", "type": "tf", "topic": "Money and prices", "stem": "Suppose a central bank creates new money far faster than the economy's output grows. Economists expect the result to be a sustained rise in prices across the economy.", "answer": true, "why": "One of the ten principles is that prices rise when the government prints too much money. More money chasing the same goods pushes up prices. Rapid money growth is the main cause of large and persistent inflation. The statement is true.", "key": "ch1-M7"}, {"id": "M8", "difficulty": "Moderate", "type": "mc", "topic": "Market failure: externalities", "stem": "A chemical plant discharges waste into a river. A water utility downstream must spend more to treat the river water, and the plant pays nothing toward this cost. This situation is an example of", "options": ["an externality, one type of market failure.", "market power, because the plant is a large firm.", "inflation, because the utility's costs rise.", "an efficient outcome, because no one was forced to trade."], "answer": 0, "reasons": ["", "Market power is the ability of one seller or small group to influence the price. Nothing here involves the plant setting prices.", "Inflation is a rise in the overall price level. A cost increase at one utility is not inflation.", "The plant ignores a cost it imposes on others, so the market does not allocate resources efficiently."], "why": "An externality is the effect of one party's actions on the well-being of a bystander. The plant imposes treatment costs on the utility and does not pay for them. Because the plant ignores this cost, it pollutes too much. This is a market failure, a case where government action can improve the outcome.", "key": "ch1-M8"}, {"id": "M9", "difficulty": "Moderate", "type": "mc", "topic": "Gains from trade", "stem": "An engineering consultancy can perform inspections and prepare drawings faster than a surveying business. Their opportunity costs differ, and they are considering exchanging these services. Which conclusion follows from the principle of gains from trade?", "options": ["Only the consultancy can benefit because it works faster.", "Only the surveying business can benefit because it is less productive.", "Any benefit to either business must be an equal loss to the other.", "Both can benefit by specializing according to their opportunity costs."], "answer": 3, "reasons": ["Faster performance does not prevent the slower business from gaining through specialization.", "The consultancy can also gain by obtaining a service at less than its own opportunity cost.", "Specialization can increase what the businesses produce together, so trade need not merely redistribute a fixed total.", ""], "why": "Being faster at both activities gives the consultancy an absolute advantage. Different opportunity costs create scope for specialization and mutually beneficial exchange. Each business can concentrate on the activity for which it gives up relatively less.", "key": "ch1-M9"}, {"id": "M10", "difficulty": "Moderate", "type": "mc", "topic": "Graphs: reverse causality", "stem": "Data for a group of cities show that cities with more police officers per resident also report more crimes per resident. A council member concludes that hiring police officers causes crime. The most likely flaw in this reasoning is", "options": ["reverse causality, because cities with more crime tend to hire more police officers.", "a negative correlation, because more police should mean less crime.", "a problem of units, because officers and crimes cannot be compared.", "a normative claim, because statements about crime cannot be tested with data."], "answer": 0, "reasons": ["", "The data show more police going with more crime, so the correlation is positive, not negative.", "Both are counts per resident. Variables in different units can still be compared and correlated.", "Whether police cause crime is a positive question about cause and effect. It can be tested with data."], "why": "The data show a positive correlation between police and crime. The council member assumes police cause crime, but the causation is more likely the other way: cities with more crime hire more officers. Mistaking the direction of cause and effect is reverse causality.", "key": "ch1-M10"}, {"id": "M11", "difficulty": "Moderate", "type": "mc", "topic": "Microeconomics and macroeconomics", "stem": "An economist working on which of these research questions is doing macroeconomics?", "options": ["How do changes in national business confidence affect total spending and employment?", "How does a fee on commercial deliveries change courier prices?", "How does a new supermarket affect prices at nearby food stores?", "How does a reduction in veterinary-school places affect veterinarians' pay?"], "answer": 0, "reasons": ["", "Courier prices concern a particular service market, so this is microeconomics.", "Competition between nearby supermarkets concerns particular firms and markets, so this is microeconomics.", "Veterinarians' pay concerns a particular labor market, so this is microeconomics."], "why": "Macroeconomics studies economy-wide phenomena such as total spending and employment. The first question concerns these aggregate outcomes. Each other question concerns a particular market and belongs to microeconomics.", "key": "ch1-M11"}, {"id": "M12", "difficulty": "Moderate", "type": "tf", "topic": "Positive and normative statements", "stem": "A claim such as \"More frequent warehouse safety inspections reduce workplace injuries\" can, in principle, be confirmed or refuted by examining evidence.", "answer": true, "why": "This is a positive statement about how the world works. Injury rates and inspection frequency can be examined with data. Whether inspections ought to be more frequent would require a value judgment as well as evidence.", "key": "ch1-M12"}, {"id": "M13", "difficulty": "Moderate", "type": "mc", "topic": "Why economists disagree", "stem": "Two economists agree that a higher tax on sugary drinks would cut consumption by about the same amount. One supports the tax because it would improve public health. The other opposes it because it takes a larger share of income from poor households. Their disagreement is about", "options": ["values, which makes it a normative question.", "the size of the tax's effect, which makes it a positive question.", "how to measure consumption, which makes it a question of data.", "nothing, because economists who agree on the facts must agree on policy."], "answer": 0, "reasons": ["", "They agree on the size of the effect, so they do not disagree about the positive question.", "Neither economist disputes the data on consumption. They agree on what the tax would do.", "People who agree on the facts can still weigh health and fairness differently, so they can disagree about policy."], "why": "Both economists accept the same estimate of the tax's effect, so they share the same positive view. They differ on how much weight to put on public health versus the burden on poor households. That is a difference in values, a normative disagreement.", "key": "ch1-M13"}, {"id": "M14", "difficulty": "Moderate", "type": "tf", "topic": "Circular-flow diagram", "stem": "When a family pays a supermarket for groceries, the circular-flow model treats the family as the seller and the supermarket as the buyer.", "answer": false, "why": "Groceries are a good, so the purchase takes place in the markets for goods and services. There, firms sell what they produce and households buy it. The supermarket is the seller and the family is the buyer. Households are the sellers in the other set of markets, the markets for the factors of production, where they sell labor, land and capital to firms. The statement is false.", "key": "ch1-M14"}, {"id": "M15", "difficulty": "Moderate", "type": "tf", "topic": "The production possibilities frontier", "stem": "As an economy moves workers from farming into car making, each additional car tends to cost more food than the last.", "answer": true, "why": "The first workers moved are those best suited to making cars, so each car costs little food. Later the economy must move workers who are better at farming, so each extra car costs more food. This rising opportunity cost is why the production possibilities frontier bows outward.", "key": "ch1-M15"}, {"id": "M16", "difficulty": "Moderate", "type": "mc", "topic": "Shifts of the frontier", "stem": "Which change lets a country produce combinations of goods that were previously beyond its capacity?", "options": ["A fall in unemployment", "An advance in technology that raises output from the same resources", "A shift of workers from making cars to making steel", "A rise in the price of steel"], "reasons": ["Putting idle workers to work moves the economy from a point inside the frontier toward it. The frontier itself does not move.", "", "Moving workers between goods changes the output mix without expanding what the existing resources and technology can produce.", "A price change can change which point the economy chooses. It does not change what the economy is able to produce."], "answer": 1, "why": "The frontier shows the most the economy can produce with its resources and technology. An advance in technology lets the same resources produce more, so the frontier shifts outward.", "key": "ch1-M16"}, {"id": "M17", "difficulty": "Moderate", "type": "mc", "topic": "Points outside the PPF", "stem": "The graph shows an economy's production possibilities frontier for housing and medical equipment. Which statement about point C is correct?", "graph": {"xlabel": "Housing (thousand units)", "ylabel": "Medical equipment (thousand units)", "xmax": 110, "ymax": 90, "xticks": [0, 40, 50, 80, 100], "yticks": [0, 30, 60, 80], "lines": [{"pts": [[0, 80.0], [5, 79.8], [10, 79.2], [15, 78.2], [20, 76.8], [25, 75.0], [30, 72.8], [35, 70.2], [40, 67.2], [45, 63.8], [50, 60.0], [55, 55.8], [60, 51.2], [65, 46.2], [70, 40.8], [75, 35.0], [80, 28.8], [85, 22.2], [90, 15.2], [95, 7.8], [100, 0.0]], "label": "PPF", "dash": false, "at": [65, 46.2]}], "dots": [{"x": 50, "y": 60, "label": "A"}, {"x": 40, "y": 30, "label": "B"}, {"x": 80, "y": 60, "label": "C"}], "guides": [{"x": 80, "y": 60}]}, "options": ["The economy can reach point C by putting idle workers and machines to work.", "Point C is an efficient point, like point A.", "Point C cannot be produced with the economy's current resources and technology.", "Point C can be produced, but only by giving up all medical equipment."], "answer": 2, "reasons": ["Putting idle resources to work can move the economy toward its frontier, but not beyond it. Point C lies outside the frontier.", "Efficient points lie on the frontier. Point C lies outside it, so it cannot be produced at all.", "", "Point C includes 60 thousand units of medical equipment, so it does not involve giving up all of it. It lies outside the frontier and cannot be produced."], "why": "The frontier shows the most the economy can produce with its resources and technology. Point C, at 80 thousand housing units and 60 thousand units of equipment, lies outside the frontier. The economy cannot produce it unless its resources grow or its technology improves.", "key": "ch1-M17"}, {"id": "M18", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost on a bowed PPF", "stem": "The graph plots the production possibilities of an economy that makes consumer goods and machines. Shifting output from point C to point D adds 20 units of consumer goods. How many machines must the economy sacrifice to get them?", "graph": {"xlabel": "Consumer goods (units)", "ylabel": "Machines (units)", "xmax": 110, "ymax": 110, "xticks": [0, 20, 40, 60, 80, 100], "yticks": [0, 36, 64, 84, 96], "lines": [{"pts": [[0, 100.0], [5, 99.75], [10, 99.0], [15, 97.75], [20, 96.0], [25, 93.75], [30, 91.0], [35, 87.75], [40, 84.0], [45, 79.75], [50, 75.0], [55, 69.75], [60, 64.0], [65, 57.75], [70, 51.0], [75, 43.75], [80, 36.0], [85, 27.75], [90, 19.0], [95, 9.75], [100, 0.0]], "label": "PPF", "dash": false, "at": [70, 51]}], "dots": [{"x": 20, "y": 96, "label": "A"}, {"x": 40, "y": 84, "label": "B"}, {"x": 60, "y": 64, "label": "C"}, {"x": 80, "y": 36, "label": "D"}], "guides": [{"x": 20, "y": 96}, {"x": 40, "y": 84}, {"x": 60, "y": 64}, {"x": 80, "y": 36}]}, "options": ["20 machines", "36 machines", "28 machines", "12 machines"], "answer": 2, "reasons": ["20 machines is the cost of moving from B to C, the previous 20 units of consumer goods. It also repeats the 20 units gained, which is not the cost.", "36 machines is the total number of machines produced at D, not the number given up.", "", "12 machines is the cost of moving from A to B. The question asks about the move from C to D."], "why": "At point C the economy makes 64 machines. At point D it makes 36 machines. Moving from C to D gives up 64 − 36 = 28 machines to gain 20 units of consumer goods. So the opportunity cost is 28 machines.", "key": "ch1-M18"}, {"id": "M19", "difficulty": "Moderate", "type": "mc", "topic": "Shape of the frontier", "stem": "The table shows the production possibilities of an economy that makes trucks and wheat. Based on the table, the production possibilities frontier is", "table": {"header": ["Trucks", "Wheat (thousand tons)"], "rows": [["0", "80"], ["100", "76"], ["200", "68"], ["300", "54"], ["400", "32"], ["500", "0"]]}, "options": ["a straight line, because each additional truck costs the same amount of wheat.", "bowed inward, because each additional truck costs less wheat than the one before.", "bowed outward, because each additional truck costs less wheat than the one before.", "bowed outward, because each additional truck costs more wheat than the one before."], "answer": 3, "reasons": ["The wheat given up for each extra 100 trucks grows from 4 to 32 thousand tons, so the cost is not constant and the frontier is not straight.", "The cost of trucks rises, not falls, and a rising cost makes the frontier bow outward, not inward.", "The shape is right but the reason is wrong. The wheat given up for each extra 100 trucks rises from 4 to 32 thousand tons.", ""], "why": "Read the wheat given up for each extra 100 trucks: 80 − 76 = 4, 76 − 68 = 8, 68 − 54 = 14, 54 − 32 = 22, 32 − 0 = 32 thousand tons. The opportunity cost of trucks rises as more are made. A rising opportunity cost makes the frontier bow outward.", "key": "ch1-M19"}, {"id": "C1", "difficulty": "Challenging", "type": "mc", "topic": "Sunk costs and marginal decisions", "stem": "A drug company has spent $40 million developing a new medicine. Finishing development will cost another $15 million, after which the medicine will earn $25 million in revenue. Alternatively, the company can sell its research now to a rival for $5 million. What should the company do?", "options": ["Abandon the project, because total spending of $55 million exceeds the $25 million of revenue.", "Sell the research now, because the sale recovers part of the money already spent.", "Finish development, because the $10 million it adds to profit exceeds the $5 million sale price.", "Either choice is equally good, because the $40 million is lost whichever way it goes."], "answer": 2, "reasons": ["The $40 million is already spent and cannot be recovered. Counting it makes the project look worse than the choice in front of the company.", "Selling brings in $5 million. Finishing brings in $25 million − $15 million = $10 million, which is more.", "", "The $40 million is sunk, but the two choices still differ: finishing yields $10 million and selling yields $5 million."], "why": "The $40 million already spent is sunk, so it should not affect the decision. Step 1: finishing adds $25 million of revenue for $15 million of extra cost, a gain of $10 million. Step 2: selling now gains $5 million. Step 3: $10 million > $5 million, so the company should finish development.", "key": "ch1-C1"}, {"id": "C2", "difficulty": "Challenging", "type": "mc", "topic": "Circular-flow diagram", "stem": "A nurse earns a salary from the hospital that employs her. She spends part of it on meals in the same hospital's cafeteria. In the circular-flow diagram, these two payments take place, in order, in", "options": ["the markets for goods and services both times, because the hospital is on both sides.", "the markets for factors of production, then the markets for goods and services.", "the markets for goods and services, then the markets for factors of production.", "the markets for factors of production both times, because both payments involve the same firm."], "answer": 1, "reasons": ["The salary pays for labor, a factor of production. Only the meal is a purchase of a good or service.", "", "The order is reversed. The salary is the factor payment and the meal is the purchase of output.", "Which market a payment belongs to depends on what is exchanged, not on which firm is involved. The meal is output, so it is in the markets for goods and services."], "why": "Step 1: the salary is paid for the nurse's labor, a factor of production, so it is in the markets for factors of production, with money flowing from the firm to her household. Step 2: the meal is output the hospital sells, so that payment is in the markets for goods and services, with money flowing from her household to the firm. That the same firm is on both sides does not change either market.", "key": "ch1-C2"}]}, {"chapter": 3, "title": "Interdependence and the Gains from Trade", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Reading production possibilities", "stem": "The graph shows the weekly production possibilities frontiers of a manufacturer's North and South plants. Each plant makes engines and gearboxes. When each plant makes gearboxes only, which plant has the higher maximum output?", "graph": {"xlabel": "Engines per week", "ylabel": "Gearboxes per week", "xmax": 35, "ymax": 45, "xticks": [0, 10, 20, 30], "yticks": [0, 10, 20, 30, 40], "lines": [{"pts": [[0.0, 40.0], [2.0, 36.0], [4.0, 32.0], [6.0, 28.0], [8.0, 24.0], [10.0, 20.0], [12.0, 16.0], [14.0, 12.0], [16.0, 8.0], [18.0, 4.0], [20.0, 0.0]], "label": "North plant", "dash": false, "at": [3, 34]}, {"pts": [[0.0, 30.0], [3.0, 27.0], [6.0, 24.0], [9.0, 21.0], [12.0, 18.0], [15.0, 15.0], [18.0, 12.0], [21.0, 9.0], [24.0, 6.0], [27.0, 3.0], [30.0, 0.0]], "label": "South plant", "dash": true, "at": [23, 10]}]}, "options": ["The South plant.", "The North plant.", "Both plants have the same maximum gearbox output.", "Neither plant can make gearboxes without also making engines."], "answer": 1, "reasons": ["The South frontier meets the gearbox axis below the North frontier.", "", "The frontiers meet the gearbox axis at different heights, so their maximum gearbox outputs differ.", "Each frontier meets the gearbox axis where engine output is 0, showing that the plant can make gearboxes alone."], "why": "When a plant makes gearboxes only, its output is read where its frontier meets the gearbox axis. North can make 40 gearboxes per week, while South can make 30. North therefore has the higher maximum gearbox output.", "key": "ch3-E1"}, {"id": "E2", "difficulty": "Easy", "type": "mc", "topic": "Imports and exports", "stem": "A hospital in Ohio buys MRI scanners that are made in Germany. From the point of view of the United States, the scanners are", "options": ["exports.", "domestic production.", "imports.", "tariffs."], "answer": 2, "reasons": ["Exports are goods made at home and sold abroad. These scanners are made abroad and sold at home.", "The scanners are made in Germany, so they are not part of U.S. production.", "", "A tariff is a tax on imported goods. The scanners are goods, not a tax."], "why": "Imports are goods produced abroad and sold at home. The scanners are produced in Germany and bought in the United States. So for the United States they are imports. For Germany they are exports.", "key": "ch3-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Production and consumption possibilities", "stem": "A remote mining town produces all of its own food and fuel and trades with no one. The combinations of food and fuel the town can consume are", "options": ["outside its current production possibilities frontier.", "set by the prices of food and fuel in other towns.", "unrelated to how much food and fuel it can produce.", "on or inside its current production possibilities frontier."], "answer": 3, "reasons": ["Consuming beyond the frontier requires trade, and this town does not trade.", "A town that does not trade is not affected by prices elsewhere when choosing what to consume.", "Without trade, everything the town consumes must first be produced by the town itself.", ""], "why": "Without trade, the town can consume only what it produces. Feasible consumption can therefore lie on or inside its production possibilities frontier. Trade can allow consumption beyond the town's current frontier.", "key": "ch3-E3"}, {"id": "E4", "difficulty": "Easy", "type": "tf", "topic": "Gains from trade", "stem": "When cheaper imported steel enters the U.S. market, U.S. steelworkers can lose income even though total U.S. consumption rises.", "answer": true, "why": "Trade raises a country's total consumption. The gains are not spread evenly. Workers and owners in an industry that now faces cheaper imports can lose income. Consumers and exporters gain more than those workers and owners lose.", "key": "ch3-E4"}, {"id": "E5", "difficulty": "Easy", "type": "tf", "topic": "Opportunity cost", "stem": "A hospital's opportunity cost of an extra surgery is the number of nurses and operating rooms the surgery uses.", "answer": false, "why": "The nurses and operating rooms are the inputs the surgery uses. Opportunity cost is what the hospital gives up to do the surgery. It is the other care, such as outpatient visits, those inputs could have provided instead.", "key": "ch3-E5"}, {"id": "E6", "difficulty": "Easy", "type": "mc", "topic": "Gains from trade", "stem": "When two utilities specialize and trade with each other, the gains they share come from differences in their", "options": ["absolute advantages.", "numbers of workers.", "opportunity costs.", "prices charged to customers."], "answer": 2, "reasons": ["Absolute advantage compares inputs. A utility with an absolute advantage in both services still gains only because opportunity costs differ.", "The number of workers sets how much each can produce, not whether trade creates a gain.", "", "Prices charged to customers do not create the gain. The gain comes from each producing what costs it least in other output."], "why": "Gains from trade come from comparative advantage. Comparative advantage rests on differences in opportunity costs. Each utility specializes in what it gives up least to produce, so total output rises.", "key": "ch3-E6"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Comparative advantage", "stem": "Two accountants share the work of an office. One of them holds a comparative advantage in preparing tax returns if", "options": ["she prepares returns faster than her colleague.", "preparing a return costs her less of her other work than it costs her colleague.", "she enjoys preparing returns more than her colleague does.", "clients pay her more for each return."], "answer": 1, "reasons": ["Preparing returns faster is an absolute advantage. Comparative advantage compares opportunity costs.", "", "Enjoying a task does not define comparative advantage. It is about what she gives up to do the task.", "What clients pay does not define comparative advantage. It is about what she gives up to do the task."], "why": "Comparative advantage compares opportunity costs. The accountant who gives up less of her other work to prepare a tax return has the comparative advantage in returns, whoever is faster.", "key": "ch3-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Absolute advantage", "stem": "A car plant in Michigan needs 20 labor hours to assemble a car. A car plant in Mexico needs 30 labor hours. Based only on this information, the Michigan plant has", "options": ["a comparative advantage in that good.", "a lower opportunity cost of that good.", "no reason to trade.", "an absolute advantage in that good."], "answer": 3, "reasons": ["Comparative advantage depends on opportunity cost, which also depends on how productive the producer is at other goods.", "Using fewer inputs does not guarantee a lower opportunity cost. That depends on what the inputs could produce instead.", "A producer with an absolute advantage can still gain from trade if its opportunity costs differ from its partner's.", ""], "why": "Absolute advantage compares the inputs needed to produce a good. The producer that needs fewer inputs, or produces more with the same inputs, has the absolute advantage.", "key": "ch3-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Gains from trade", "stem": "Two countries trade, and each specializes in the good it produces at the lower opportunity cost. Compared with no trade,", "options": ["both countries can consume more, even if one is better at producing both goods.", "only the country that is better at producing both goods gains.", "one country's gain equals the other country's loss.", "neither gains unless both are equally productive."], "answer": 0, "reasons": ["", "Absolute advantage in both goods does not prevent the other country from gaining at mutually beneficial trading terms.", "Specialization raises total output, so trade is not a contest in which one side's gain is the other's loss.", "Gains come from differences in opportunity costs. Equal productivity would remove them, not create them."], "why": "When each producer specializes in the good with the lower opportunity cost, total output rises. Trading at a price between their opportunity costs lets each consume more than it could produce alone. This holds even when one producer is better at making both goods.", "key": "ch3-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Comparative advantage", "stem": "A person can have an absolute advantage in both of two goods, but cannot have a comparative advantage in both.", "answer": true, "why": "If a person's opportunity cost of one good is lower than another person's, then the opportunity cost of the other good, its inverse, is higher. So each person has a comparative advantage in at most one of the two goods, even though one person can be faster at both.", "key": "ch3-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost", "stem": "An engineering firm can complete either 12 bridge inspections or 36 building inspections in a week, and can switch between the two at a constant rate. What is the firm's opportunity cost of one bridge inspection?", "options": ["3 building inspections", "1/3 of a building inspection", "12 building inspections", "36 building inspections"], "answer": 0, "reasons": ["", "1/3 reverses the ratio: 12 / 36 gives bridge inspections forgone per building inspection, rather than building inspections forgone per bridge inspection.", "12 is the number of bridge inspections in a week, not the cost of one of them.", "36 building inspections is the cost of all 12 bridge inspections, not of one."], "why": "A week of work yields 12 bridge inspections or 36 building inspections. So 12 bridge inspections cost 36 building inspections. One bridge inspection costs 36 / 12 = 3 building inspections.", "key": "ch3-M5"}, {"id": "M6", "difficulty": "Moderate", "type": "tf", "topic": "Consumption with trade", "stem": "Peru produces 40 tons of fish and 20 tons of corn. It exports 12 tons of fish in exchange for 7 tons of corn, with no other trade. Peru then consumes 52 tons of fish and 27 tons of corn.", "answer": false, "why": "Exports reduce the amount available to consume at home, while imports increase it. Fish consumption is 40 − 12 = 28 tons. Corn consumption is 20 + 7 = 27 tons. The claim of 52 tons of fish adds exports instead of subtracting them, so the statement is false.", "key": "ch3-M6"}, {"id": "M7", "difficulty": "Moderate", "type": "mc", "topic": "Finding comparative advantage", "stem": "The table shows what two financial analysts can each produce in one hour. Who has the comparative advantage in writing reports, and why?", "table": {"header": ["Analyst", "Reports per hour", "Spreadsheets per hour"], "rows": [["Ana", "4", "8"], ["Ben", "1", "4"]]}, "options": ["Ben, because he is slower at both tasks.", "Ana, because she can produce more spreadsheets.", "Ana, because a report costs her 2 spreadsheets and costs Ben 4.", "Ben, because a report takes him a full hour."], "answer": 2, "reasons": ["Being slower at both tasks says nothing about comparative advantage, which compares opportunity costs.", "Producing more spreadsheets is an absolute advantage in spreadsheets. It does not decide who has the comparative advantage in reports.", "", "A report taking Ben an hour is about time, not opportunity cost. In that hour he gives up 4 spreadsheets, more than Ana gives up."], "why": "Ana's report costs her the 8 / 4 = 2 spreadsheets she could have made instead. Ben's report costs him 4 / 1 = 4 spreadsheets. Ana gives up less for each report, so she has the comparative advantage in reports.", "key": "ch3-M7"}, {"id": "M8", "difficulty": "Moderate", "type": "mc", "topic": "Absolute advantage", "stem": "Ana and Ben, the two analysts in the table, can switch between tasks at a constant rate. Which statement about absolute advantage is correct?", "table": {"header": ["Analyst", "Reports per hour", "Spreadsheets per hour"], "rows": [["Ana", "4", "8"], ["Ben", "1", "4"]]}, "options": ["Ana has an absolute advantage in both reports and spreadsheets.", "Ben has an absolute advantage in spreadsheets, because a spreadsheet costs him less in reports.", "Ana has an absolute advantage in reports only.", "Neither has an absolute advantage, because each has a comparative advantage in one good."], "answer": 0, "reasons": ["", "A spreadsheet costing Ben less in reports is a comparative advantage. Absolute advantage compares output per hour, and Ana makes 8 spreadsheets an hour to Ben's 4.", "Ana also makes more spreadsheets per hour, 8 to Ben's 4, so her absolute advantage covers both goods.", "Comparative advantage in one good each does not remove absolute advantage. Ana produces more of both goods per hour."], "why": "Absolute advantage compares output from the same input. In one hour Ana makes 4 reports to Ben's 1 and 8 spreadsheets to Ben's 4. So Ana has the absolute advantage in both goods.", "key": "ch3-M8"}, {"id": "M9", "difficulty": "Moderate", "type": "mc", "topic": "Opportunity cost from a PPF", "stem": "The graph shows the yearly production possibilities frontiers of Canada and Mexico for lumber and textiles. What is Canada's opportunity cost of 1 million yards of textiles, and which country has the comparative advantage in textiles?", "graph": {"xlabel": "Lumber (millions of tons)", "ylabel": "Textiles (millions of yards)", "xmax": 70, "ymax": 90, "xticks": [0, 10, 20, 30, 40, 50, 60], "yticks": [0, 20, 40, 60, 80], "lines": [{"pts": [[0.0, 80.0], [4.0, 72.0], [8.0, 64.0], [12.0, 56.0], [16.0, 48.0], [20.0, 40.0], [24.0, 32.0], [28.0, 24.0], [32.0, 16.0], [36.0, 8.0], [40.0, 0.0]], "label": "Canada", "dash": false, "at": [8, 64]}, {"pts": [[0.0, 60.0], [6.0, 54.0], [12.0, 48.0], [18.0, 42.0], [24.0, 36.0], [30.0, 30.0], [36.0, 24.0], [42.0, 18.0], [48.0, 12.0], [54.0, 6.0], [60.0, 0.0]], "label": "Mexico", "dash": true, "at": [48, 12]}]}, "options": ["2 million tons of lumber; Mexico has the comparative advantage.", "1/2 million tons of lumber; Mexico has the comparative advantage.", "2 million tons of lumber; Canada has the comparative advantage.", "1/2 million tons of lumber; Canada has the comparative advantage."], "answer": 3, "reasons": ["2 million tons is the cost the wrong way round. Canada gives up 2 million yards of textiles per million tons of lumber, not 2 million tons of lumber per million yards.", "The cost of 1/2 is right, but Mexico gives up 60 / 60 = 1 million tons of lumber per million yards, which is more than Canada's 1/2.", "2 million tons is the cost the wrong way round. Canada's frontier runs from 40 million tons of lumber to 80 million yards of textiles.", ""], "why": "Canada can make 40 million tons of lumber or 80 million yards of textiles. So 1 million yards of textiles costs 40 / 80 = 1/2 million tons of lumber. Mexico can make 60 of each, so 1 million yards costs it 1 million tons of lumber. Canada's cost is lower, so Canada has the comparative advantage in textiles.", "key": "ch3-M9"}, {"id": "M10", "difficulty": "Moderate", "type": "mc", "topic": "Gains from trade", "stem": "The graph shows Kenya's production possibilities frontier for tea and flowers. Point A is Kenya's production and consumption without trade. Point B is Kenya's consumption after it specializes and trades. Which statement is correct?", "graph": {"xlabel": "Tea (millions of kg)", "ylabel": "Flowers (millions of stems)", "xmax": 60, "ymax": 60, "xticks": [0, 10, 20, 25, 30, 40, 50], "yticks": [0, 10, 20, 30, 35, 40, 50], "lines": [{"pts": [[0.0, 50.0], [5.0, 45.0], [10.0, 40.0], [15.0, 35.0], [20.0, 30.0], [25.0, 25.0], [30.0, 20.0], [35.0, 15.0], [40.0, 10.0], [45.0, 5.0], [50.0, 0.0]], "label": "PPF", "dash": false, "at": [38, 12]}], "dots": [{"x": 20, "y": 30, "label": "A"}, {"x": 25, "y": 35, "label": "B"}], "guides": [{"x": 20, "y": 30}, {"x": 25, "y": 35}]}, "options": ["Kenya consumes 5 million kg more tea and 5 million more stems, which trade makes possible beyond its frontier.", "Kenya consumes 25 million kg more tea and 35 million more stems, the amounts at point B.", "Kenya consumes 5 million kg more tea and 5 million more stems, because its frontier has shifted outward.", "Kenya cannot reach point B, because it lies outside the frontier."], "answer": 0, "reasons": ["", "25 and 35 are Kenya's total consumption at B. The gain is the difference between B and A.", "The frontier has not moved. Trade lets Kenya consume beyond the frontier without any change in what it can produce.", "A point outside the frontier cannot be produced, but it can be consumed when a country trades."], "why": "At A Kenya consumes 20 million kg of tea and 30 million stems. At B it consumes 25 million kg and 35 million stems. The gain is 25 - 20 = 5 of tea and 35 - 30 = 5 of flowers. B lies outside the frontier. Kenya cannot produce it, but trade lets Kenya consume it.", "key": "ch3-M10"}, {"id": "M11", "difficulty": "Moderate", "type": "mc", "topic": "Production without specialization", "stem": "The table shows the labor hours Brazil and Vietnam need to make 1 ton of coffee and 1 ton of steel. Each country has 48 labor hours and spends half of them on each good. Total output of the two countries together is", "table": {"header": ["Country", "Hours per ton of coffee", "Hours per ton of steel"], "rows": [["Brazil", "2", "8"], ["Vietnam", "3", "6"]]}, "options": ["40 tons of coffee and 14 tons of steel.", "12 tons of coffee and 3 tons of steel.", "20 tons of coffee and 7 tons of steel.", "24 tons of coffee and 6 tons of steel."], "answer": 2, "reasons": ["40 and 14 assume each country spends all 48 hours on each good. Each country spends only 24 hours on each.", "12 and 3 are Brazil's output alone. Vietnam's 8 tons of coffee and 4 tons of steel must be added.", "", "24 and 6 are the most Brazil could make of each good using all 48 hours on that good. They are not the totals for both countries."], "why": "Each country spends 24 hours on each good. Brazil makes 24 / 2 = 12 tons of coffee and 24 / 8 = 3 tons of steel. Vietnam makes 24 / 3 = 8 tons of coffee and 24 / 6 = 4 tons of steel. Together they make 12 + 8 = 20 tons of coffee and 3 + 4 = 7 tons of steel.", "key": "ch3-M11"}, {"id": "M12", "difficulty": "Moderate", "type": "mc", "topic": "Absolute and comparative advantage", "stem": "The table shows the hours one factory in Germany and one factory in Poland need to make 1 machine tool and 1 ton of chemicals. Which statement is correct?", "table": {"header": ["Factory", "Hours per machine tool", "Hours per ton of chemicals"], "rows": [["Germany", "4", "2"], ["Poland", "6", "2"]]}, "options": ["Germany has the comparative advantage in both goods, because it never needs more hours than Poland.", "Poland has the comparative advantage in chemicals, because 1 ton costs it 1/3 of a machine tool and costs Germany 1/2.", "Poland has the comparative advantage in machine tools, because each machine tool costs it 3 tons of chemicals.", "Neither factory has a comparative advantage in chemicals, because both need 2 hours per ton."], "answer": 1, "reasons": ["Needing no more hours is about absolute advantage. No producer can have the lower opportunity cost of both goods.", "", "A machine tool costs Poland 6 / 2 = 3 tons of chemicals but costs Germany only 4 / 2 = 2, so Germany has the comparative advantage in machine tools.", "Equal hours per ton do not mean equal opportunity costs. The 2 hours give up 1/2 of a machine tool in Germany and 1/3 in Poland."], "why": "In Germany, the 2 hours for 1 ton of chemicals could make 2 / 4 = 1/2 of a machine tool. In Poland, they could make 2 / 6 = 1/3 of a machine tool. Poland gives up less, so Poland has the comparative advantage in chemicals. Germany has it in machine tools.", "key": "ch3-M12"}, {"id": "M13", "difficulty": "Moderate", "type": "mc", "topic": "Specialization", "stem": "A senior partner at a law firm types twice as fast as her legal secretary. Each hour she spends typing costs the firm $500 in lost client billings. Each hour the secretary spends typing costs the firm $40 in other work not done. Who should do the typing?", "options": ["The partner, because she has the absolute advantage in typing.", "The partner, because she types faster and so finishes sooner.", "Either of them, because the firm pays for the work either way.", "The secretary, because the typing she could do in 2 hours costs the firm $80, against $500 when the partner does it."], "answer": 3, "reasons": ["An absolute advantage in typing does not settle who should type. What matters is the opportunity cost.", "Finishing sooner does not make typing cheaper. Each hour of the partner's time costs the firm $500 in billings.", "The cost to the firm differs a great deal depending on who types, so the choice is not a matter of indifference.", ""], "why": "One hour of the partner's typing equals 2 hours of the secretary's. That work costs the firm $500 if the partner does it and 2 × $40 = $80 if the secretary does it. The secretary has the lower opportunity cost of typing, so she has the comparative advantage in it. The partner should spend her time on client work.", "key": "ch3-M13"}, {"id": "M14", "difficulty": "Moderate", "type": "mc", "topic": "Comparative advantage", "stem": "A new technology doubles the output per worker of U.S. firms in both software and aircraft, while productivity abroad does not change. What happens to the U.S. comparative advantage?", "options": ["It does not change, because the opportunity cost of each good in terms of the other stays the same.", "It now covers both goods, because U.S. workers are more productive in both.", "It switches to the other good, because the U.S. frontier has moved outward.", "It disappears, because other countries no longer have anything to offer."], "answer": 0, "reasons": ["", "Higher productivity does not establish comparative advantage, which depends on relative opportunity costs.", "The frontier moves outward, but its slope does not change. So the opportunity cost, and the comparative advantage, stay the same.", "Any initial opportunity-cost differences between the countries remain after equal proportional productivity gains in both U.S. goods."], "why": "Opportunity cost is the amount of one good given up to make another. If output per worker doubles for both goods, the ratio between them is unchanged. So the U.S. opportunity cost of each good is unchanged. Its comparative advantage is the same as before, even though its productivity rises.", "key": "ch3-M14"}, {"id": "M15", "difficulty": "Moderate", "type": "tf", "topic": "Gains from trade", "stem": "Two hospitals give up the same number of X-rays to process one lab test. Neither hospital can gain by specializing and trading lab tests for X-rays with the other.", "answer": true, "why": "Gains from specialization and trade come from differences in opportunity costs. If the hospitals give up the same number of X-rays per lab test, the only price both could accept without either losing is their common opportunity cost. At that price each hospital gets exactly what a lab test costs it to make, so neither gains from specialization and trade.", "key": "ch3-M15"}, {"id": "M16", "difficulty": "Moderate", "type": "mc", "topic": "Comparative advantage", "stem": "Two machine-tool firms make lathes and drills. For Firm X, 1 lathe costs 4 drills. For Firm Y, 1 drill costs 1/2 of a lathe. Which firm has the comparative advantage in each good?", "options": ["Firm X in lathes and Firm Y in drills.", "Firm Y in lathes and Firm X in drills.", "Firm Y in both lathes and drills.", "Neither firm, because their opportunity costs are the same."], "answer": 1, "reasons": ["A lathe costs Firm X 4 drills but costs Firm Y only 2, so Firm Y, not Firm X, has the comparative advantage in lathes.", "", "No firm can have the lower opportunity cost of both goods. If Firm Y's cost of lathes is lower, its cost of drills is higher.", "The costs differ: a lathe costs Firm X 4 drills and Firm Y 2 drills."], "why": "For Firm Y, 1 drill costs 1/2 of a lathe, so 1 lathe costs it 2 drills. A lathe costs Firm X 4 drills. Firm Y's cost of a lathe is lower, so Firm Y has the comparative advantage in lathes. A drill costs Firm X 1/4 of a lathe and Firm Y 1/2, so Firm X has the comparative advantage in drills.", "key": "ch3-M16"}, {"id": "M17", "difficulty": "Moderate", "type": "tf", "topic": "Terms of trade", "stem": "France gives up 2 barrels of wine to make 1 ton of cheese, and Spain gives up 4 barrels. If France sells cheese to Spain at 5 barrels of wine per ton, both countries gain.", "answer": false, "why": "France gains, because it receives 5 barrels for a ton that costs it 2. Spain could make a ton of cheese itself by giving up 4 barrels of wine. Paying 5 barrels leaves Spain worse off. Both countries gain only at a price above 2 and below 4 barrels per ton.", "key": "ch3-M17"}, {"id": "M18", "difficulty": "Moderate", "type": "mc", "topic": "Shape of the PPF", "stem": "A county road department divides its crews between repaving roads and repairing bridges. Its production possibilities frontier for these two tasks is a straight line when", "options": ["the department spends exactly half of its crew hours on each task.", "the department faces no trade-off between repaving and repairing bridges.", "a bridge repair always takes more crew hours than a mile of repaving.", "each additional bridge repair always requires giving up the same amount of repaving."], "answer": 3, "reasons": ["How the crew hours are split picks a point on the frontier. It does not decide the frontier's shape.", "Any downward-sloping frontier, straight or bowed, shows a trade-off. A straight line means the trade-off is constant, not absent.", "A bridge taking more crew hours than a mile of repaving does not establish a constant opportunity cost.", ""], "why": "The slope of the frontier measures repaving forgone per additional bridge repair. A straight line has the same slope everywhere, so each additional bridge repair must cost the same amount of repaving.", "key": "ch3-M18"}, {"id": "M19", "difficulty": "Moderate", "type": "tf", "topic": "PPF assumptions", "stem": "A production possibilities frontier is drawn for given resources and technology. So a new technology that raises an economy's output of both goods moves the economy along its existing frontier rather than shifting the frontier.", "answer": false, "why": "The frontier holds technology fixed. Better technology lets the economy make more of both goods with the same resources. That shifts the whole frontier outward. A move along the frontier only reallocates resources between the goods.", "key": "ch3-M19"}, {"id": "C1", "difficulty": "Challenging", "type": "mc", "topic": "Feasible production", "stem": "The graph shows a mill's production possibilities frontier for steel beams and steel pipes over one week. The mill can switch between the two at a constant rate. Which combination can it produce in 2 weeks?", "graph": {"xlabel": "Steel beams", "ylabel": "Steel pipes", "xmax": 50, "ymax": 25, "xticks": [0, 10, 20, 30, 40], "yticks": [0, 5, 10, 15, 20], "lines": [{"pts": [[0.0, 20.0], [4.0, 18.0], [8.0, 16.0], [12.0, 14.0], [16.0, 12.0], [20.0, 10.0], [24.0, 8.0], [28.0, 6.0], [32.0, 4.0], [36.0, 2.0], [40.0, 0.0]], "label": "PPF", "dash": false, "at": [28, 6]}]}, "options": ["60 beams and 15 pipes", "50 beams and 15 pipes", "70 beams and 10 pipes", "20 beams and 35 pipes"], "answer": 1, "reasons": ["60 + 2 × 15 = 90, which is more than the 80 beams' worth of output the mill can make in 2 weeks.", "", "70 + 2 × 10 = 90, which is more than the 80 beams' worth of output the mill can make in 2 weeks.", "20 + 2 × 35 = 90, which is more than the 80 beams' worth of output the mill can make in 2 weeks."], "why": "In one week the mill makes 40 beams or 20 pipes, so 1 pipe costs 2 beams. In 2 weeks it makes 80 beams or 40 pipes. A combination is possible if beams + 2 × pipes is at most 80. For 50 beams and 15 pipes, 50 + 2 × 15 = 80, which is on the frontier. The other three combinations each give 90, which is beyond it.", "key": "ch3-C1"}, {"id": "C2", "difficulty": "Challenging", "type": "mc", "topic": "Terms of trade", "stem": "The graph shows the monthly production possibilities frontiers of Japan and Vietnam for machines and textiles. Japan specializes in machines and sells them to Vietnam for textiles. At which price would both countries gain?", "graph": {"xlabel": "Machines", "ylabel": "Textiles (bolts)", "xmax": 25, "ymax": 70, "xticks": [0, 5, 10, 15, 20], "yticks": [0, 10, 20, 30, 40, 50, 60], "lines": [{"pts": [[0.0, 40.0], [2.0, 36.0], [4.0, 32.0], [6.0, 28.0], [8.0, 24.0], [10.0, 20.0], [12.0, 16.0], [14.0, 12.0], [16.0, 8.0], [18.0, 4.0], [20.0, 0.0]], "label": "Japan", "dash": false, "at": [14, 12]}, {"pts": [[0.0, 60.0], [1.0, 54.0], [2.0, 48.0], [3.0, 42.0], [4.0, 36.0], [5.0, 30.0], [6.0, 24.0], [7.0, 18.0], [8.0, 12.0], [9.0, 6.0], [10.0, 0.0]], "label": "Vietnam", "dash": true, "at": [2, 48]}]}, "options": ["1 bolt per machine", "2 bolts per machine", "4 bolts per machine", "7 bolts per machine"], "answer": 2, "reasons": ["At 1 bolt Japan receives less than the 2 bolts each machine costs it, so Japan loses.", "At 2 bolts Japan receives exactly what a machine costs it, so Japan gains nothing.", "", "At 7 bolts Vietnam pays more than the 6 bolts it would give up to make a machine itself, so Vietnam loses."], "why": "Japan can make 20 machines or 40 bolts, so a machine costs it 40 / 20 = 2 bolts. Vietnam can make 10 machines or 60 bolts, so a machine costs it 60 / 10 = 6 bolts. Both gain if the price is above 2 bolts and below 6 bolts per machine. Of the prices listed, only 4 bolts lies in that range.", "key": "ch3-C2"}, {"id": "C3", "difficulty": "Challenging", "type": "mc", "topic": "Comparative advantage", "stem": "Germany and Italy each make cars and wine. A German worker can make 4 cars or 12 cases of wine a month. An Italian worker can make 2 cars or 10 cases of wine a month. A new process raises an Italian worker's car output to 5 cars a month. Italian wine output per worker and all German output stay the same. Which result follows?", "options": ["Italy now has the comparative advantage in cars and Germany in wine, so the direction of trade reverses.", "Italy now has the comparative advantage in both goods, because its workers are more productive.", "Germany keeps the comparative advantage in cars, because German productivity did not change.", "Neither country can gain from trade any longer, because Italy is now better at making cars."], "answer": 0, "reasons": ["", "One producer cannot have the comparative advantage in both goods. If a car costs Italy less wine, wine costs Italy more cars.", "Comparative advantage depends on opportunity costs relative to the other country. Italy's cost of a car is now the lower one.", "Gains from trade come from differences in opportunity costs. Those differences remain, so both countries can still gain."], "why": "Step 1: Before the change, a car costs Germany 12 ÷ 4 = 3 cases of wine and costs Italy 10 ÷ 2 = 5 cases, so Germany has the comparative advantage in cars. Step 2: After the change, a car costs Italy 10 ÷ 5 = 2 cases, less than Germany's 3, so Italy now has the comparative advantage in cars. Step 3: A case of wine costs Germany 4 ÷ 12 = 1/3 of a car and costs Italy 5 ÷ 10 = 1/2 of a car, so Germany has the comparative advantage in wine. Each country exports the good in which it has the comparative advantage, so Italy now exports cars and Germany exports wine, the reverse of the earlier pattern.", "key": "ch3-C3"}, {"id": "C4", "difficulty": "Challenging", "type": "mc", "topic": "Gains from specialization", "stem": "The table shows the hours two technicians at a processing plant need for each task. Each works 32 hours a week. At first each spends 16 hours on each task. Then each spends all 32 hours on the task in which he or she has a comparative advantage. Compared with the first arrangement, their combined weekly output rises by", "table": {"header": ["Technician", "Hours per pump service", "Hours per tank inspection"], "rows": [["A", "2", "8"], ["B", "4", "4"]]}, "options": ["4 pump services and 2 tank inspections.", "16 pump services and 8 tank inspections.", "12 pump services and 6 tank inspections.", "4 pump services and 4 tank inspections."], "answer": 0, "reasons": ["", "16 pump services and 8 tank inspections are the totals after specializing. The question asks for the rise.", "12 pump services and 6 tank inspections are the totals before specialization, rather than the increases.", "Tank inspections rise from 6 to 8, an increase of 2 rather than 4."], "why": "A pump service costs A 2 / 8 = 1/4 of an inspection and costs B 4 / 4 = 1 inspection, so A specializes in pump services and B in tank inspections. Initially A completes 16 / 2 = 8 pump services and 16 / 8 = 2 inspections, while B completes 16 / 4 = 4 pump services and 16 / 4 = 4 inspections. Combined output is 12 pump services and 6 inspections. After specialization, A completes 32 / 2 = 16 pump services and B completes 32 / 4 = 8 inspections. Output rises by 16 − 12 = 4 pump services and 8 − 6 = 2 inspections.", "key": "ch3-C4"}, {"id": "C5", "difficulty": "Challenging", "type": "mc", "topic": "Gains from trade", "stem": "The table shows what one worker in Canada and one worker in Mexico can produce in a year. The two countries would have nothing to gain from trading wheat for tractors if Mexico's output of tractors per worker changed to", "table": {"header": ["Country", "Tons of wheat per worker", "Tractors per worker"], "rows": [["Canada", "40", "2"], ["Mexico", "60", "1"]]}, "options": ["1 tractor.", "2 tractors.", "6 tractors.", "3 tractors."], "answer": 3, "reasons": ["1 tractor is Mexico's current output. A tractor then costs Mexico 60 tons of wheat and Canada 20, so gains from trade exist.", "At 2 tractors a tractor costs Mexico 30 tons of wheat, which still differs from Canada's 20.", "At 6 tractors a tractor costs Mexico 10 tons of wheat, which differs from Canada's 20, so gains from trade remain.", ""], "why": "A tractor costs Canada 40 / 2 = 20 tons of wheat. Gains from trade vanish when the opportunity costs are equal. So a tractor must also cost Mexico 20 tons of wheat. Mexico's worker grows 60 tons, so the worker would have to build 60 / 20 = 3 tractors.", "key": "ch3-C5"}]}, {"chapter": 4, "title": "The Market Forces of Supply and Demand", "questions": [{"id": "E1", "difficulty": "Easy", "type": "mc", "topic": "Competitive markets", "stem": "Suppose many farms grow wheat and many flour mills buy it. No single farm or mill is large enough to affect the price of wheat. Economists call a market like this", "options": ["a monopoly market.", "a market in shortage.", "a competitive market.", "a market for an inferior good."], "answer": 2, "reasons": ["A monopoly has one seller who can set the price, but here there are many sellers and none can move the price.", "A shortage describes a price below equilibrium, and nothing in the description says the price is below equilibrium.", "", "Whether a good is inferior depends on how demand responds to income, which the description does not mention."], "why": "A competitive market has many buyers and many sellers. Each one is so small that it has a negligible effect on the market price. The described wheat farms and flour mills fit that definition.", "key": "ch4-E1"}, {"id": "E2", "difficulty": "Easy", "type": "tf", "topic": "Law of demand", "stem": "A demand curve for wheat slopes downward because, other things equal, buyers purchase more wheat when its price is lower.", "answer": true, "why": "This is the law of demand. Holding other factors fixed, a lower price raises the quantity demanded. Plotting price against quantity demanded therefore gives a downward-sloping curve. The statement is true.", "key": "ch4-E2"}, {"id": "E3", "difficulty": "Easy", "type": "mc", "topic": "Supply schedule", "stem": "A steel mill publishes a list showing how many tons of steel it will sell at each possible price, with all other conditions held fixed. This list is", "options": ["a demand schedule.", "a supply schedule.", "a market equilibrium.", "a production budget."], "answer": 1, "reasons": ["A demand schedule shows what buyers want to purchase at each price, but this list comes from a seller.", "", "An equilibrium is a single price and quantity where the two sides of the market agree, not a list of prices and quantities.", "A production budget specifies planned output for a period based on expected sales and inventory needs, rather than quantities offered at different prices."], "why": "A supply schedule is a table that pairs each price with the quantity sellers offer, other things equal. The mill's list does exactly that.", "key": "ch4-E3"}, {"id": "E4", "difficulty": "Easy", "type": "mc", "topic": "Law of supply", "stem": "Other things equal, mining companies offer more copper for sale when the price of copper is higher. Economists call this relationship", "options": ["the law of demand.", "the law of supply.", "an increase in supply.", "market equilibrium."], "answer": 1, "reasons": ["The law of demand describes buyers, who purchase less at a higher price; here the sellers are responding.", "", "An increase in supply is a shift of the whole curve, but here only the price of copper changes, which is a move along the curve.", "Equilibrium is where quantity demanded equals quantity supplied; the statement says nothing about buyers."], "why": "The law of supply says that, other things equal, the quantity supplied rises when the price rises. Mining companies selling more copper at a higher copper price is that law at work.", "key": "ch4-E4"}, {"id": "E5", "difficulty": "Easy", "type": "mc", "topic": "Complements", "stem": "Electric forklifts and charging equipment are used together. When a fall in the price of forklifts raises the demand for charging equipment, the two goods are", "options": ["substitutes.", "complements.", "inferior goods.", "normal goods."], "answer": 1, "reasons": ["Substitutes replace each other, so a cheaper forklift would lower the demand for the other good, not raise it.", "", "An inferior good is defined by how demand responds to income, not to the price of another good.", "A normal good is defined by how demand responds to income, not to the price of another good."], "why": "Complements are goods used together. A lower price of one raises the demand for the other. Cheaper forklifts raise the demand for charging equipment, so the two are complements.", "key": "ch4-E5"}, {"id": "E6", "difficulty": "Easy", "type": "mc", "topic": "Monopoly", "stem": "In one city, a single utility supplies piped water to every household and sets the rate it charges. Economists describe this market as", "options": ["a competitive market.", "a monopoly.", "a market in surplus.", "a market with many competing water suppliers."], "answer": 1, "reasons": ["A competitive market has many sellers that cannot set the price, but here one seller sets it.", "", "A surplus means quantity supplied exceeds quantity demanded at the current price, which the description does not say.", "The utility is the only water supplier in this city, so there are no competing water suppliers."], "why": "A monopoly is a market with one seller, and that seller sets the price. The water utility is the only seller and chooses its rate.", "key": "ch4-E6"}, {"id": "E7", "difficulty": "Easy", "type": "mc", "topic": "Equilibrium price", "stem": "The price at which the quantity that buyers are willing and able to purchase exactly matches the quantity that sellers are willing and able to sell is called the", "options": ["shortage price.", "surplus price.", "equilibrium price.", "maximum price."], "answer": 2, "reasons": ["A shortage occurs at a price where buyers want more than sellers offer, so the two quantities do not match.", "A surplus occurs at a price where sellers offer more than buyers want, so the two quantities do not match.", "", "The highest price buyers might pay has no reason to make the two quantities equal."], "why": "Equilibrium is the price at which quantity demanded equals quantity supplied. Economists call it the equilibrium, or market-clearing, price.", "key": "ch4-E7"}, {"id": "E8", "difficulty": "Easy", "type": "tf", "topic": "Market demand", "stem": "The market demand curve for gasoline is found by adding up, at each price, the quantities that all the individual buyers of gasoline want to purchase.", "answer": true, "why": "Market demand is the sum of individual demands. At each price, add the quantities all buyers want. This is a horizontal sum of the individual demand curves.", "key": "ch4-E8"}, {"id": "M1", "difficulty": "Moderate", "type": "mc", "topic": "Movement along the demand curve", "stem": "The price of a movie ticket falls from $15 to $12, and nothing else changes. Moviegoers buy more tickets. On a graph of the ticket market, this is", "options": ["a rightward shift of the demand curve for tickets.", "a leftward shift of the demand curve for tickets.", "a movement down along the demand curve for tickets.", "a leftward shift of the supply curve for tickets."], "answer": 2, "reasons": ["A change in the ticket's own price does not shift the demand curve. Shifts come from other factors, such as income or the prices of related goods.", "A change in the ticket's own price does not shift the demand curve.", "", "Nothing has changed sellers' costs, so the supply curve has not shifted."], "why": "The demand curve shows the quantity demanded at each price. A change in the good's own price moves buyers along the curve. A lower price leads to a larger quantity demanded, so this is a movement down along the same demand curve.", "key": "ch4-M1"}, {"id": "M2", "difficulty": "Moderate", "type": "mc", "topic": "Substitutes", "stem": "Granite and quartz countertops are substitutes in this market. A shipping disruption raises the price of granite countertops. Nothing else changes. In the market for quartz countertops,", "options": ["demand rises.", "demand falls.", "nothing changes, because quartz countertops are a different product.", "supply falls."], "answer": 0, "reasons": ["", "Demand for a good falls when the price of a complement rises. Quartz countertops are substitutes for granite countertops, so their demand rises.", "Demand for quartz countertops depends on the prices of substitutes, so more expensive granite countertops raise it.", "The stated shipping disruption affects granite countertops, and all supply determinants for quartz countertops are unchanged."], "why": "Substitutes are goods that can be used in place of each other. When granite countertops become more expensive, some buyers switch to quartz countertops, so the demand curve for quartz countertops shifts to the right.", "key": "ch4-M2"}, {"id": "M3", "difficulty": "Moderate", "type": "mc", "topic": "Surplus and shortage", "stem": "When the price of a good is above its equilibrium price, there is", "options": ["a shortage, and the price tends to rise.", "a shortage, and the price tends to fall.", "a surplus, and the price tends to rise.", "a surplus, and the price tends to fall."], "answer": 3, "reasons": ["Above the equilibrium price, sellers offer more than buyers want. That is a surplus, not a shortage.", "Above the equilibrium price, the quantity supplied exceeds the quantity demanded. That is a surplus, not a shortage.", "With unsold goods, sellers cut prices to attract buyers. The price falls, not rises.", ""], "why": "At a price above equilibrium, the quantity supplied exceeds the quantity demanded, which is a surplus. Sellers with unsold goods cut their prices. The price falls until the market reaches equilibrium.", "key": "ch4-M3"}, {"id": "M4", "difficulty": "Moderate", "type": "tf", "topic": "Input prices and supply shifts", "stem": "Bakeries pay lower prices for flour. Economists describe this as an increase in the quantity of bread supplied along an unchanged supply curve, not as a shift of the supply curve.", "answer": false, "why": "Flour is an input. A lower input price cuts the cost of each loaf, so bakeries offer more bread at every price. The supply curve shifts right. A movement along the curve happens only when the price of bread itself changes. The statement is false.", "key": "ch4-M4"}, {"id": "M5", "difficulty": "Moderate", "type": "tf", "topic": "Shift in demand versus change in quantity supplied", "stem": "Incomes rise, and restaurant meals are a normal good. Demand for restaurant meals increases and their price rises. In response, the supply curve for restaurant meals shifts to the right.", "answer": false, "why": "Higher income raises demand for a normal good, so the demand curve shifts right and the price rises. Restaurants respond to the higher price by moving up their unchanged supply curve. That is an increase in quantity supplied, not an increase in supply. The supply curve shifts only when a determinant other than the price of meals changes. The statement is false.", "key": "ch4-M5"}, {"id": "M6", "difficulty": "Moderate", "type": "mc", "topic": "Reading equilibrium off a graph", "stem": "The graph shows the weekly market for 50-pound bags of lawn fertilizer sold by garden suppliers in one region. At the market equilibrium, the price and the quantity sold are", "graph": {"xlabel": "Quantity (thousands of bags per week)", "ylabel": "Price ($ per bag)", "xmax": 100, "ymax": 50, "xticks": [0, 25, 50, 75, 100], "yticks": [0, 10, 20, 30, 40, 50], "lines": [{"pts": [[0.0, 40.0], [100.0, 0.0]], "label": "Demand", "dash": false, "at": [75, 10]}, {"pts": [[0.0, 10.0], [100.0, 30.0]], "label": "Supply", "dash": false, "at": [70, 27]}]}, "options": ["$10 per bag and 50,000 bags.", "$20 per bag and 50,000 bags.", "$20 per bag and 100,000 bags.", "$40 per bag and 50,000 bags."], "answer": 1, "reasons": ["$10 is where the supply curve meets the price axis, not where supply and demand cross.", "", "100,000 bags is where the demand curve meets the quantity axis, at a price of $0, not the equilibrium quantity.", "$40 is where the demand curve meets the price axis, not the price at which the two curves cross."], "why": "Equilibrium is where the demand and supply curves cross. Demand is P = 40 − 0.4Q. Supply is P = 10 + 0.2Q. Setting them equal gives 30 = 0.6Q, so Q = 50 thousand bags. Then P = 10 + 0.2 × 50 = $20 per bag.", "key": "ch4-M6"}, {"id": "M7", "difficulty": "Moderate", "type":
