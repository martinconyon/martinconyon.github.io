 buys two goods, X and Y. As she moves along the curve from bundle A to bundle B, what is her marginal rate of substitution, in units of Y per unit of X?", "graph": {"xlabel": "Quantity of X (units)", "ylabel": "Quantity of Y (units)", "xmax": 22, "ymax": 32, "xticks": [0, 4, 8, 12, 16, 20], "yticks": [0, 6, 12, 18, 24, 30], "lines": [{"pts": [[3.2, 30.0], [3.48, 27.586], [3.76, 25.532], [4.04, 23.762], [4.32, 22.222], [4.6, 20.87], [4.88, 19.672], [5.16, 18.605], [5.44, 17.647], [5.72, 16.783], [6.0, 16.0], [6.28, 15.287], [6.56, 14.634], [6.84, 14.035], [7.12, 13.483], [7.4, 12.973], [7.68, 12.5], [7.96, 12.06], [8.24, 11.65], [8.52, 11.268], [8.8, 10.909], [9.08, 10.573], [9.36, 10.256], [9.64, 9.959], [9.92, 9.677], [10.2, 9.412], [10.48, 9.16], [10.76, 8.922], [11.04, 8.696], [11.32, 8.481], [11.6, 8.276], [11.88, 8.081], [12.16, 7.895], [12.44, 7.717], [12.72, 7.547], [13.0, 7.385], [13.28, 7.229], [13.56, 7.08], [13.84, 6.936], [14.12, 6.799], [14.4, 6.667], [14.68, 6.54], [14.96, 6.417], [15.24, 6.299], [15.52, 6.186], [15.8, 6.076], [16.08, 5.97], [16.36, 5.868], [16.64, 5.769], [16.92, 5.674], [17.2, 5.581], [17.48, 5.492], [17.76, 5.405], [18.04, 5.322], [18.32, 5.24], [18.6, 5.161], [18.88, 5.085], [19.16, 5.01], [19.44, 4.938], [19.72, 4.868], [20.0, 4.8]], "label": "IC", "dash": false, "at": [18, 7.5]}], "areas": [], "dots": [{"x": 4, "y": 24, "label": "A"}, {"x": 8, "y": 12, "label": "B"}], "guides": [{"x": 4, "y": 24}, {"x": 8, "y": 12}]}, "options": ["3", "0.33", "12", "2"], "answer": 0, "reasons": ["", "0.33 is 4 / 12, the units of X gained per unit of Y given up. That inverts the rate.", "12 is the total number of units of Y she gives up, 24 − 12, not the amount per unit of X.", "2 is 24 / 12, the ratio of her holdings of Y at A and at B, not the rate at which she trades Y for X."], "why": "From A to B she gives up 24 − 12 = 12 units of Y and gains 8 − 4 = 4 units of X, and she is equally satisfied. Her marginal rate of substitution is 12 / 4 = 3 units of Y per unit of X.", "key": "ch22-M14"}, {"id": "M15", "difficulty": "Moderate", "type": "mc", "topic": "Shifts of the budget line", "stem": "The graph shows how an accountant's budget line for goods X and Y moves from BC1 to BC2. Only one thing changed. What was it?", "graph": {"xlabel": "Quantity of X (units)", "ylabel": "Quantity of Y (units)", "xmax": 40, "ymax": 45, "xticks": [0, 10, 20, 30], "yticks": [0, 10, 20, 30, 40], "lines": [{"pts": [[0, 20], [30, 0]], "label": "BC1", "dash": false, "at": [10, 13]}, {"pts": [[0, 40], [30, 0]], "label": "BC2", "dash": false, "at": [13, 22]}], "areas": [], "dots": [], "guides": []}, "options": ["The price of Y fell.", "Her income rose.", "The price of X fell.", "The price of Y rose."], "answer": 0, "reasons": ["", "A larger income moves both intercepts out. Here the X intercept stays at 30 units.", "A fall in the price of X would move the X intercept out. Here it is the Y intercept that moves out.", "A rise in the price of Y would move the Y intercept in, below 20 units, not out to 40."], "why": "The X intercept stays at 30 units, so neither her income nor the price of X changed. The Y intercept rises from 20 to 40 units: the same income now buys twice as many units of Y. So the price of Y fell by half, and the line pivots out around the X intercept.", "key": "ch22-M15"}, {"id": "M16", "difficulty": "Moderate", "type": "tf", "topic": "The income effect", "stem": "Bus rides are an inferior good for a retail worker. When bus fares fall, the income effect of the lower fare leads her to take fewer bus rides.", "answer": true, "why": "A lower fare raises her purchasing power, as if her income had risen. When income rises, a consumer buys less of an inferior good. So the income effect leads her to take fewer bus rides. The substitution effect works the other way, toward more rides.", "key": "ch22-M16"}, {"id": "M17", "difficulty": "Moderate", "type": "mc", "topic": "Prices from the budget line", "stem": "A paramedic has $1,200 a month to spend on two goods, X and Y. The price of X rises, and her budget line moves from BC1 to BC2 in the graph. What is the new price of X?", "graph": {"xlabel": "Quantity of X (units)", "ylabel": "Quantity of Y (units)", "xmax": 70, "ymax": 50, "xticks": [0, 10, 20, 30, 40, 50, 60], "yticks": [0, 10, 20, 30, 40], "lines": [{"pts": [[0, 40], [60, 0]], "label": "BC1", "dash": false, "at": [50, 10]}, {"pts": [[0, 40], [40, 0]], "label": "BC2", "dash": false, "at": [22, 8]}], "dots": [], "areas": [], "guides": []}, "options": ["$20", "$10", "$30", "$1"], "answer": 2, "reasons": ["$20 is $1,200 / 60, the old price of X read from BC1, not from the new line BC2.", "$10 is the rise in the price of X, $30 − $20, not the new price.", "", "$1 treats the absolute value of the slope of BC2, 40 / 40 = 1, as a dollar price; that absolute value is the price of X relative to Y, in units of Y."], "why": "The X intercept of BC2 shows how many units of X the whole budget buys at the new price: 40 units. So the new price of X is $1,200 / 40 = $30. Before the rise, BC1 reached 60 units, so the old price was $1,200 / 60 = $20.", "key": "ch22-M17"}, {"id": "C1", "difficulty": "Challenging", "type": "mc", "topic": "The substitution effect", "stem": "A consumer chooses positive amounts of coffee and other goods and has smooth indifference curves bowed strictly inward. The price of coffee falls while the prices of other goods stay the same. The substitution effect of this change", "options": ["makes the consumer buy less coffee.", "depends on whether coffee is a normal or an inferior good.", "makes the consumer buy more coffee, because coffee is now cheaper relative to other goods.", "is zero if the consumer's income does not change."], "reasons": ["The substitution effect of a lower price always leads the consumer toward the good that has become cheaper.", "Whether a good is normal or inferior decides the direction of the income effect, not the substitution effect.", "", "The substitution effect comes from the change in relative prices. It works even when income is unchanged."], "answer": 2, "why": "The substitution effect is the change in what the consumer buys because relative prices have changed, holding her satisfaction fixed. When coffee becomes cheaper relative to other goods, she moves along her indifference curve toward more coffee. It always works in that direction. The income effect, which depends on whether coffee is normal or inferior, comes on top.", "key": "ch22-C1"}, {"id": "C2", "difficulty": "Challenging", "type": "mc", "topic": "Marginal rate of substitution at the optimum", "stem": "A pharmacist divides her monthly spending between two goods, X and Y. The graph shows her budget line, BC, and the indifference curve, IC, that just touches it at her chosen bundle E. At E, how many units of Y is she willing to give up for one more unit of X?", "graph": {"xlabel": "Quantity of X (units)", "ylabel": "Quantity of Y (units)", "xmax": 50, "ymax": 30, "xticks": [0, 10, 20, 30, 40], "yticks": [0, 6, 12, 18, 24], "lines": [{"pts": [[0, 24], [40, 0]], "label": "BC", "dash": false, "at": [1.25, 23.25]}, {"pts": [[8.0, 30.0], [8.6, 27.907], [9.2, 26.087], [9.8, 24.49], [10.4, 23.077], [11.0, 21.818], [11.6, 20.69], [12.2, 19.672], [12.8, 18.75], [13.4, 17.91], [14.0, 17.143], [14.6, 16.438], [15.2, 15.789], [15.8, 15.19], [16.4, 14.634], [17.0, 14.118], [17.6, 13.636], [18.2, 13.187], [18.8, 12.766], [19.4, 12.371], [20.0, 12.0], [20.6, 11.65], [21.2, 11.321], [21.8, 11.009], [22.4, 10.714], [23.0, 10.435], [23.6, 10.169], [24.2, 9.917], [24.8, 9.677], [25.4, 9.449], [26.0, 9.231], [26.6, 9.023], [27.2, 8.824], [27.8, 8.633], [28.4, 8.451], [29.0, 8.276], [29.6, 8.108], [30.2, 7.947], [30.8, 7.792], [31.4, 7.643], [32.0, 7.5], [32.6, 7.362], [33.2, 7.229], [33.8, 7.101], [34.4, 6.977], [35.0, 6.857], [35.6, 6.742], [36.2, 6.63], [36.8, 6.522], [37.4, 6.417], [38.0, 6.316], [38.6, 6.218], [39.2, 6.122], [39.8, 6.03], [40.4, 5.941], [41 function graph(g){
  // GRAPH: {xlabel, ylabel, xmax, ymax, xticks:[], yticks:[], lines:[{pts:[[x,y]..], label, dash, at:[x,y] optional label spot}],
  //         areas:[{pts:[[x,y]..], label, at:[x,y] optional label spot}], dots:[{x, y, label}], guides:[{x, y}]}
  const L = 64, R = 470, T = 18, B = 318;
  const X = x => L + (x / g.xmax) * (R - L), Y = y => B - (y / g.ymax) * (B - T);
  const fills = ["#C9D6F5", "#F5DCC9", "#D3EBD9", "#EBD3E6", "#F2EBC2"];
  let s = `<svg class="g" viewBox="0 0 560 370" role="img" aria-label="${esc(g.ylabel)} against ${esc(g.xlabel)}">`;
  (g.areas || []).forEach((a, i) => {
    s += `<polygon points="${a.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="${fills[i % fills.length]}" stroke="none"/>`;
    const cx = a.at ? X(a.at[0]) : a.pts.reduce((t, p) => t + X(p[0]), 0) / a.pts.length, cy = a.at ? Y(a.at[1]) : a.pts.reduce((t, p) => t + Y(p[1]), 0) / a.pts.length;
    if (a.label) s += `<text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2430">${esc(a.label)}</text>`;
  });
  for (const v of (g.xticks || [])) s += `<line x1="${X(v)}" y1="${B}" x2="${X(v)}" y2="${B + 5}" stroke="#1E2430"/><text x="${X(v)}" y="${B + 20}" text-anchor="middle" font-size="13">${v}</text>`;
  for (const v of (g.yticks || [])) s += `<line x1="${L - 5}" y1="${Y(v)}" x2="${L}" y2="${Y(v)}" stroke="#1E2430"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="13">${v}</text>`;
  for (const d of (g.guides || [])) s += `<polyline points="${L},${Y(d.y)} ${X(d.x)},${Y(d.y)} ${X(d.x)},${B}" fill="none" stroke="#6A7280" stroke-dasharray="4 4"/>`;
  for (const ln of (g.lines || [])){
    s += `<polyline points="${ln.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="#3d5a80" stroke-width="2.5" ${ln.dash ? 'stroke-dasharray="7 5"' : ""}/>`;
    const e = ln.at || ln.pts[ln.pts.length - 1];
    if (ln.label) s += `<text x="${X(e[0]) + 6}" y="${Y(e[1]) - 6}" font-size="14" fill="#3d5a80">${esc(ln.label)}</text>`;
  }
  for (const d of (g.dots || [])) s += `<circle cx="${X(d.x)}" cy="${Y(d.y)}" r="4" fill="#1E2430"/>` + (d.label ? `<text x="${X(d.x) + 7}" y="${Y(d.y) - 7}" font-size="14" font-weight="bold">${esc(d.label)}</text>` : "");
  s += `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#1E2430" stroke-width="1.5"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#1E2430" stroke-width="1.5"/>`;
  s += `<text x="${(L + R) / 2}" y="${B + 44}" text-anchor="middle" font-size="14">${esc(g.xlabel)}</text>`;
  s += `<text x="16" y="${(T + B) / 2}" text-anchor="middle" font-size="14" transform="rotate(-90 16 ${(T + B) / 2})">${esc(g.ylabel)}</text>`;
  return s + `</svg>`;
}
function chosen(){
  const qs = [];
  for (const c of CHAPTERS) if (pick.chapters.has(c.chapter))
    for (const q of c.questions) if (pick.level === "All" || q.difficulty === pick.level) qs.push({...q, chapter: c.chapter, name: c.label ? "Chapters " + c.label : "Chapter " + c.chapter});
  return qs.sort((a,b) => a.chapter - b.chapter || (RANK[a.difficulty] - RANK[b.difficulty]));
}
function home(){
  run = null;
  let h = `<h1>EC 111 Practice Questions</h1><p class="sub">Principles of Microeconomics. Choose the chapters and the level. Wrong answers come with an explanation; on multiple choice you get a second try first.</p><h2>Chapters</h2>`;
  for (const c of CHAPTERS){
    const tried = c.questions.filter(q => progress[q.key]).length;
    const first = c.questions.filter(q => progress[q.key] === "first").length;
    h += `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${pick.chapters.has(c.chapter) ? "checked" : ""}> <span><b>${c.label ? "Chapters " + esc(c.label) : "Chapter " + c.chapter}</b> ${esc(c.title)}</span><small>${tried} of ${c.questions.length} tried · ${first} right first time</small></label>`;
  }
  h += `<h2>Level</h2><div class="seg">` + ["Easy","Moderate","Challenging","All"].map(l => `<button data-lv="${l}" class="${pick.level === l ? "on" : ""}">${l}</button>`).join("") + `</div>`;
  const n = chosen().length;
  h += `<button class="go" id="start" ${n ? "" : "disabled"}>${n ? `Start · ${n} question${n === 1 ? "" : "s"}` : "Choose a chapter"}</button>`;
  h += `<p class="foot">Progress is saved in this browser only. <a href="#" id="reset">Clear my progress</a> · <a href="../">EC 111 home</a></p>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-ch]").forEach(b => b.onchange = () => { const ch = +b.dataset.ch; b.checked ? pick.chapters.add(ch) : pick.chapters.delete(ch); home(); });
  app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { pick.level = b.dataset.lv; home(); });
  document.getElementById("start").onclick = () => { run = {qs: chosen(), i: 0, firstRight: 0}; show(); };
  document.getElementById("reset").onclick = e => { e.preventDefault(); progress = {}; store.set(progress); home(); };
}
function show(){
  const q = run.qs[run.i];
  const opts = q.type === "mc" ? q.options : ["True","False"];
  let h = `<div class="meta"><span>${esc(q.name)} · ${q.difficulty} · ${q.type === "mc" ? "Multiple choice" : "True or false"}</span><span>${run.i + 1} of ${run.qs.length}</span></div>`;
  h += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.graph) h += graph(q.graph);
  if (q.table){
    h += `<table><tr>${q.table.header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    for (const r of q.table.rows) h += `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`;
    h += `</table>`;
  }
  opts.forEach((o, k) => h += `<button class="opt" data-k="${k}"><span class="l">${q.type === "mc" ? "abcdefgh"[k] + "." : ""}</span>${esc(o)}</button>`);
  h += `<div id="fb"></div>`;
  app.innerHTML = h; window.scrollTo(0, 0);
  const right = q.type === "mc" ? q.answer : (q.answer ? 0 : 1);
  let tries = 0;
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; tries++;
    const fb = document.getElementById("fb");
    if (k === right || q.type === "tf" || tries >= 2){
      btns.forEach(x => x.disabled = true);
      btns[right].classList.add("right");
      if (k !== right) b.classList.add("wrong");
      const first = k === right && tries === 1;
      if (first) run.firstRight++;
      if (!progress[q.key] || first) progress[q.key] = first ? "first" : "tried";
      store.set(progress);
      const last = run.i === run.qs.length - 1;
      fb.innerHTML = `<div class="msg ${k === right ? "good" : "bad"}">${k === right ? "Correct." : "Not correct. The answer is " + (q.type === "mc" ? "abcdefgh"[right] + "." : opts[right] + ".")}</div>${k !== right && q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : ""}<div class="why">${esc(q.why)}</div><div class="nav"><button id="quit">Back to chapters</button><button class="on" id="next">${last ? "See my score" : "Next question"}</button></div>`;
      document.getElementById("quit").onclick = home;
      document.getElementById("next").onclick = () => { if (last) done(); else { run.i++; show(); } };
    } else {
      b.classList.add("wrong"); b.disabled = true;
      const why = q.reasons && q.reasons[k] ? `<div class="why">${esc(q.reasons[k])}</div>` : "";
      fb.innerHTML = `<div class="msg bad">Not quite.</div>${why}<div class="msg">Try once more.</div>`;
    }
  });
}
function done(){
  app.innerHTML = `<h1>Finished</h1><p class="score">${run.firstRight} of ${run.qs.length} right first time</p><div class="nav"><button id="again">Same set again</button><button class="on" id="menu">Back to chapters</button></div>`;
  document.getElementById("again").onclick = () => { run.i = 0; run.firstRight = 0; show(); };
  document.getElementById("menu").onclick = home;
}
home();
</script></body></html>
